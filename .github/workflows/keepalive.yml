name: Keep Render service warm

# Render free tier sleeps after 15 minutes of inactivity, causing a
# 30s–2min cold start when the next visitor hits the API.
#
# BUDGET (this is the constraint that bit us on 2026-08-31):
# The Render workspace gets 750 free INSTANCE HOURS per calendar month,
# shared across every free service in it — currently bane-api plus the
# aaplus-api service (confusingly named "Client-Websites" after its repo).
# A pinged service never sleeps, so it burns a full hour every hour.
#
# The previous cron here was '*/10 * * * *' — every 10 minutes of every
# hour, 24/7 — despite a comment claiming it only covered 12am-11pm UTC.
# That kept bane-api awake ~730 hrs/month on its own, 97% of the entire
# workspace budget, and guaranteed both services got suspended before
# month end. It did exactly that on 2026-08-31 and again 2026-09-28.
#
# Split agreed 2026-10-23 (stay free; AA Plus gets the larger share
# because its checkout is order-critical):
#   aaplus-api  7am-7pm Pacific (VPS cron)  ~12.25 h/day -> ~380 h/month
#   bane-api    14:00-22:59 UTC (this file)  ~9.25 h/day -> ~290 h/month
#   total ~670 h of 750, ~80 h left for visits outside the windows.
# 14-22 UTC = 9am-6pm Central in CDT (8am-5pm in CST; cron is UTC).
# Outside the window the service sleeps and the first visitor takes a
# cold start, which is the deliberate trade.
#
# If a third free service is ever added to this workspace, narrow these
# windows again or move to a paid instance — 750 hrs does not stretch.
#
# GitHub auto-disables scheduled workflows after 60 days without repo
# activity (this bit us 2026-07-12). The weekly cron below re-enables
# this workflow via the API, which resets that 60-day timer.

on:
  schedule:
    - cron: '*/10 14-22 * * *'
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reset 60-day inactivity timer
        if: github.event_name != 'schedule' || github.event.schedule == '0 12 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
      - name: Ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 https://bane-api.onrender.com/healthz || echo "fail")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "All attempts failed"
          exit 1
