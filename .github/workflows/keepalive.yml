name: Keep Render service warm

# Render free tier sleeps after 15 minutes of inactivity, causing a
# 30s–2min cold start when the next visitor hits the API. This pings
# /healthz every 10 minutes during active hours (12am–11pm UTC = 7pm prev
# day to 6pm Central Time, covering US daytime) so the service stays
# warm for real users.
#
# GitHub auto-disables scheduled workflows after 60 days without repo
# activity (this bit us 2026-07-12). The weekly cron below re-enables
# this workflow via the API, which resets that 60-day timer.

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reset 60-day inactivity timer
        if: github.event_name != 'schedule' || github.event.schedule == '0 12 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
      - name: Ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 https://bane-api.onrender.com/healthz || echo "fail")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "All attempts failed"
          exit 1
